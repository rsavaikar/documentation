title: Silver Fox Apps documentation
description: Guides, policies and support for Silver Fox Apps
theme: jekyll-theme-minimal
# Vendor logo in the header of every page (source: assets/brand/vendor-logo.svg).
logo: /assets/brand/vendor-logo-144.png

# GitHub Pages reads this file only at the repository root, so it applies to every app.
# Each app's pages live in their own folder (for example jira-cloud-connector-docs/);
# redirect_from in a page's front matter keeps older URLs working.
plugins:
  - jekyll-redirect-from

github:
  is_project_page: false
